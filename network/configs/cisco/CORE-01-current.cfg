!
! CORE-01 - current sanitized network configuration
! Based on the CLI output supplied with this repository package.
! Credentials and password hashes intentionally removed.
!
version 15.7
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname CORE-01
!
! REDACTED: enable credential removed
!
no aaa new-model
!
ip dhcp excluded-address 192.168.10.1
ip dhcp excluded-address 192.168.20.1
ip dhcp excluded-address 192.168.30.1
ip dhcp excluded-address 192.168.40.1
ip dhcp excluded-address 192.168.10.1 192.168.10.20
ip dhcp excluded-address 192.168.20.1 192.168.20.20
!
ip dhcp pool HR
 network 192.168.10.0 255.255.255.0
 default-router 192.168.10.1
 dns-server 8.8.8.8 1.1.1.1
!
ip dhcp pool IT
 network 192.168.20.0 255.255.255.0
 default-router 192.168.20.1
 dns-server 8.8.8.8 1.1.1.1
!
ip dhcp pool ENG
 network 192.168.30.0 255.255.255.0
 default-router 192.168.30.1
 dns-server 8.8.8.8 1.1.1.1
!
ip dhcp pool SALES
 network 192.168.40.0 255.255.255.0
 default-router 192.168.40.1
 dns-server 8.8.8.8 1.1.1.1
!
ip dhcp pool VLAN10-HR
 default-router 192.168.10.1
 dns-server 8.8.8.8 1.1.1.1
!
ip dhcp pool VLAN20-IT
 default-router 192.168.20.1
 dns-server 8.8.8.8 1.1.1.1
!
ip domain name enterprise.local
ip cef
no ipv6 cef
!
! REDACTED: local username credential removed
!
interface Ethernet0/0
 no ip address
 duplex auto
!
interface Ethernet0/0.10
 encapsulation dot1Q 10
 ip address 192.168.10.1 255.255.255.0
!
interface Ethernet0/0.20
 encapsulation dot1Q 20
 ip address 192.168.20.1 255.255.255.0
!
interface Ethernet0/1
 no ip address
 duplex auto
!
interface Ethernet0/1.30
 encapsulation dot1Q 30
 ip address 192.168.30.1 255.255.255.0
!
interface Ethernet0/1.40
 encapsulation dot1Q 40
 ip address 192.168.40.1 255.255.255.0
!
interface Ethernet0/2
 ip address 10.0.11.1 255.255.255.0
 duplex auto
!
interface Ethernet0/3
 ip address 10.0.10.1 255.255.255.0
 duplex auto
!
interface Ethernet1/0
 ip address 10.0.12.1 255.255.255.0
 duplex auto
!
interface Ethernet1/1
 ip address 10.0.20.2 255.255.255.252
 duplex auto
!
interface Ethernet1/2
 no ip address
 shutdown
 duplex auto
!
interface Ethernet1/3
 no ip address
 shutdown
 duplex auto
!
router ospf 1
 router-id 1.1.1.1
 network 10.0.10.0 0.0.0.255 area 0
 network 10.0.11.0 0.0.0.255 area 0
 network 10.0.12.0 0.0.0.255 area 0
 network 10.0.20.0 0.0.0.255 area 0
 network 192.168.10.0 0.0.0.255 area 0
 network 192.168.20.0 0.0.0.255 area 0
 network 192.168.30.0 0.0.0.255 area 0
 network 192.168.40.0 0.0.0.255 area 0
!
no ip http server
no ip http secure-server
ip route 0.0.0.0 0.0.0.0 10.0.20.1
ip ssh version 2
!
banner motd ^CAUTHORIZED ACCESS ONLY^C
!
line con 0
 ! REDACTED: line password removed
 logging synchronous
 login
line aux 0
line vty 0 4
 ! REDACTED: line password removed
 login local
 transport input ssh
!
end
