!
! ISP - current sanitized network configuration
! Based on the CLI output supplied with this repository package.
! Credentials and password hashes intentionally removed.
!
version 15.7
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname isp
!
! REDACTED: enable credential removed
!
no aaa new-model
!
ip domain name enterprise.local
ip cef
no ipv6 cef
!
! REDACTED: local username credential removed
!
interface Ethernet0/0
 description TO-PFSENSE-WAN
 ip address 10.0.50.1 255.255.255.252
 ip nat inside
 ip virtual-reassembly in
 duplex auto
!
interface Ethernet0/1
 description INTERNAL-TRANSIT
 ip address 10.0.30.1 255.255.255.0
 ip nat inside
 ip virtual-reassembly in
 duplex auto
!
interface Ethernet0/2
 description TO-PNETLAB-HOST-NETWORK
 ip address dhcp
 ip nat outside
 ip virtual-reassembly in
 duplex auto
!
interface Ethernet0/3
 no ip address
 shutdown
 duplex auto
!
router ospf 1
 router-id 5.5.5.5
 network 10.0.20.0 0.0.0.255 area 0
 network 10.0.30.0 0.0.0.255 area 0
 default-information originate
!
no ip http server
no ip http secure-server
ip nat inside source list 1 interface Ethernet0/2 overload
ip route 0.0.0.0 0.0.0.0 dhcp
ip ssh version 2
!
access-list 1 permit 192.168.0.0 0.0.255.255
!
line con 0
 logging synchronous
line aux 0
line vty 0 4
 login local
 transport input ssh
!
end
